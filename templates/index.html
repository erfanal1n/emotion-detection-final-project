<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detection</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
</head>
<body>
    <main class="page-shell">
        <section class="detector-card" aria-labelledby="page-title">
            <p class="eyebrow">Watson NLP · English</p>
            <h1 id="page-title">Emotion Detection</h1>
            <p class="intro">See the emotions expressed in a sentence.</p>

            <form id="emotion-form">
                <label for="textToAnalyze">Your text</label>
                <textarea id="textToAnalyze" name="textToAnalyze" rows="5"
                          maxlength="1000" placeholder="Type a sentence to analyze..."
                          required></textarea>
                <button type="submit">Analyze text</button>
            </form>

            <section class="result-panel" aria-labelledby="result-title">
                <h2 id="result-title">Analysis result</h2>
                <p id="system_response" aria-live="polite">Your result will appear here.</p>
            </section>
        </section>
        <p class="page-note">Emotion predictions are estimates based on the submitted text.</p>
    </main>
</body>
</html>
